<!doctype html>
<html><head><meta charset="utf-8"><title>8 Ball Pool (Local)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#050b16;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;user-select:none}
</style></head><body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================= layout =================
const W=1280,H=720;
const R=14.5,D=2*R;
const X0=150,X1=1130,Y0=170,Y1=660,MX=(X0+X1)/2,MY=(Y0+Y1)/2;   // cushion noses, exact 2:1
const CD=17,WOOD=35;                 // cushion depth, wooden rail width
const CJ=37.5,CB=18,SN=30,SB=25;     // corner jaw (nose/back), side pocket half-gap (nose/back)
const HEAD=X0+(X1-X0)*0.235, FOOT={x:X0+(X1-X0)*0.75,y:MY};
const PCK=[
 {x:X0-14.4,y:Y0-13.5,r:31,hr:30,c:1,o:[-1,-1]},{x:MX,y:Y0-25,r:25,hr:24,c:0,o:[0,-1]},{x:X1+14.4,y:Y0-13.5,r:31,hr:30,c:1,o:[1,-1]},
 {x:X0-14.4,y:Y1+13.5,r:31,hr:30,c:1,o:[-1,1]},{x:MX,y:Y1+25,r:25,hr:24,c:0,o:[0,1]},{x:X1+14.4,y:Y1+13.5,r:31,hr:30,c:1,o:[1,1]}];
const CUSH=[
 [[X0+CB,Y0-CD],[X0+CJ,Y0],[MX-SN,Y0],[MX-SB,Y0-CD]],
 [[MX+SB,Y0-CD],[MX+SN,Y0],[X1-CJ,Y0],[X1-CB,Y0-CD]],
 [[X0+CB,Y1+CD],[X0+CJ,Y1],[MX-SN,Y1],[MX-SB,Y1+CD]],
 [[MX+SB,Y1+CD],[MX+SN,Y1],[X1-CJ,Y1],[X1-CB,Y1+CD]],
 [[X0-CD,Y0+CB],[X0,Y0+CJ],[X0,Y1-CJ],[X0-CD,Y1-CB]],
 [[X1+CD,Y0+CB],[X1,Y0+CJ],[X1,Y1-CJ],[X1+CD,Y1-CB]]];
const SEGS=[];
for(const p of CUSH){SEGS.push({a:p[0],b:p[1],e:.55},{a:p[1],b:p[2],e:.78},{a:p[2],b:p[3],e:.55})}
for(const s of SEGS){const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1];s.dx=dx;s.dy=dy;s.l2=dx*dx+dy*dy}
// UI regions
const PBAR={x:24,y:200,w:54,h:440};
const SPINB={x:1226,y:58,r:27};
const CUEB={x:1226,y:150,s:46};
const MENUB={x:52,y:58,s:50};
const TRAY={x:1207,y0:250,y1:698};
const WHEEL={x:1240,y:220,w:32,h:420};

// ================= physics constants =================
const MAXV=2500;        // px/s at full power
const SLIDE=1260;       // sliding friction decel (mu_s*g)
const ROLL=190;         // rolling resistance decel (mu_r*g)
const SPINK=1.7;        // max top/back spin as fraction of speed
const ENG=0.65;         // max side-spin factor
const BALL_E=0.95, H_STEP=1/960;

// ================= state =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1,scale=1;
let balls=[],players,cur,mode='menu',phase='aim',isBreak,ballInHand,kitchen,winner,winText;
let aimAng=0,power=0,spin={x:0,y:0},spinOpen=false,nominated=-1,timer=30,shot=null,strike=null;
let msg='',msgT=0,tray=[],ai=null,vsCPU=true,wheelOff=0;
let drag=null; // {type:'aim'|'power'|'wheel'|'cue', ...}
const TURN_TIME=30;
const groupOf=n=>n<8?'solids':'stripes';
const cue=()=>balls[0];
const left=g=>balls.filter(b=>b.on&&b.n&&b.n!==8&&groupOf(b.n)===g).length;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const isCPU=i=>vsCPU&&i===1;
const pname=i=>vsCPU?(i?'Computer':'You'):'Player '+(i+1);
function toast(m){msg=m;msgT=3.5}

// ================= balls & 3D rendering =================
const COL=[[255,250,234],[254,180,10],[52,124,228],[242,8,24],[104,60,162],[242,118,36],[18,146,66],[138,28,32],[10,10,10]];
const BS=60,TEX=[];
(function(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 for(let n=1;n<=15;n++){x.fillStyle='#fff';x.fillRect(0,0,64,64);x.fillStyle='#000';x.font='bold '+(n>9?40:50)+'px Arial';
  x.textAlign='center';x.textBaseline='middle';x.fillText(n,32,36);const d=x.getImageData(0,0,64,64).data,t=new Uint8Array(4096);
  for(let i=0;i<4096;i++)t[i]=d[i*4];TEX[n]=t}})();
function mkBall(n,x,y){
 const c=document.createElement('canvas');c.width=c.height=BS;const a=(Math.random()-.5)*.6;
 return {n,x,y,vx:0,vy:0,ux:0,uy:0,s:0,on:true,sink:null,cv:c,cx:c.getContext('2d'),img:null,dirty:true,
  ex:[Math.cos(a),Math.sin(a),0],ey:[-Math.sin(a),Math.cos(a),0],ez:[0,0,1]};
}
function randomOrient(b){
 // numbers mostly facing up, tilted a random amount in a random direction (like the real game)
 const az=Math.random()*Math.PI*2,c0=Math.cos(az),s0=Math.sin(az);rotV(b.ex,[0,0,1],c0,s0);rotV(b.ey,[0,0,1],c0,s0);rotV(b.ez,[0,0,1],c0,s0);
 const dir=Math.random()*Math.PI*2,k=[Math.cos(dir),Math.sin(dir),0],th=Math.random()*1.05,c=Math.cos(th),s=Math.sin(th);
 rotV(b.ex,k,c,s);rotV(b.ey,k,c,s);rotV(b.ez,k,c,s);
 ortho(b);b.dirty=true;
}
const LV=(()=>{const l=[-.35,-.45,1],m=Math.hypot(...l);return l.map(v=>v/m)})();
const HV=(()=>{const h=[LV[0],LV[1],LV[2]+1],m=Math.hypot(...h);return h.map(v=>v/m)})();
function renderBall(b){
 if(!b.img)b.img=b.cx.createImageData(BS,BS);
 const d=b.img.data,n=b.n,col=COL[n>8?n-8:n],stripe=n>8,tex=TEX[n],ex=b.ex,ey=b.ey,ez=b.ez,h=BS/2;
 for(let j=0;j<BS;j++)for(let i=0;i<BS;i++){
  const k=(j*BS+i)*4,dx=(i+.5-h)/h,dy=(j+.5-h)/h,d2=dx*dx+dy*dy;
  if(d2>=1){d[k+3]=0;continue}
  const nz=Math.sqrt(1-d2);
  const lx=dx*ex[0]+dy*ex[1]+nz*ex[2],ly=dx*ey[0]+dy*ey[1]+nz*ey[2],lz=dx*ez[0]+dy*ez[1]+nz*ez[2];
  let c=col;
  if(n===0)c=COL[0];
  else if(stripe&&Math.abs(lz)>.66)c=COL[0];
  if(n>0&&Math.abs(lz)>.885){
   const u=(lz>0?lx:-lx)/.47,v=ly/.47,tx=((u+1)*31.5)|0,ty=((v+1)*31.5)|0;
   const t=(tx>=0&&tx<64&&ty>=0&&ty<64)?tex[ty*64+tx]:255;
   c=t<128?[12,12,12]:[252,252,250];
  }
  // flat, saturated look of the real game: high ambient, crisp highlight, thin dark outline, soft rim light
  const r=Math.sqrt(d2),dif=Math.max(0,dx*LV[0]+dy*LV[1]+nz*LV[2]),hd=Math.max(0,dx*HV[0]+dy*HV[1]+nz*HV[2]);
  let sh=.8+.26*dif;
  if(r>.83)sh*=1-Math.min(1,(r-.83)/.17)*.85;
  const rim=Math.max(0,(dx+dy)*.7)*Math.pow(r,5)*70*(r<.9?1:0);
  const sp=Math.pow(hd,60)*255+Math.pow(hd,12)*45+rim;
  d[k]=Math.min(255,c[0]*sh+sp);d[k+1]=Math.min(255,c[1]*sh+sp);d[k+2]=Math.min(255,c[2]*sh+sp);
  d[k+3]=Math.min(1,(1-r)*h*1.3)*255;
 }
 b.cx.putImageData(b.img,0,0);b.dirty=false;
}
function rotV(v,k,c,s){ // Rodrigues
 const kv=k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
 const cx=k[1]*v[2]-k[2]*v[1],cy=k[2]*v[0]-k[0]*v[2],cz=k[0]*v[1]-k[1]*v[0];
 v[0]=v[0]*c+cx*s+k[0]*kv*(1-c);v[1]=v[1]*c+cy*s+k[1]*kv*(1-c);v[2]=v[2]*c+cz*s+k[2]*kv*(1-c);
}
function rollBall(b,dx,dy){
 const m=Math.hypot(dx,dy);if(m<1e-4)return;
 const k=[-dy/m,dx/m,0],th=m/R,c=Math.cos(th),s=Math.sin(th);
 rotV(b.ex,k,c,s);rotV(b.ey,k,c,s);rotV(b.ez,k,c,s);b.dirty=true;
}
function ortho(b){ // keep basis orthonormal
 const n=v=>{const m=Math.hypot(...v);v[0]/=m;v[1]/=m;v[2]/=m};
 n(b.ex);const e=b.ex,y=b.ey,dt=e[0]*y[0]+e[1]*y[1]+e[2]*y[2];y[0]-=e[0]*dt;y[1]-=e[1]*dt;y[2]-=e[2]*dt;n(y);
 b.ez=[e[1]*y[2]-e[2]*y[1],e[2]*y[0]-e[0]*y[2],e[0]*y[1]-e[1]*y[0]];
}

// ================= sound =================
let ac=null;
function audio(){if(!ac)try{ac=new AudioContext()}catch(e){}}
let noiseBuf=null,lastSnd={};
function noise(){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function snd(type,v){
 if(!ac)return;const t=ac.currentTime;if(lastSnd[type]&&t-lastSnd[type]<.012)return;lastSnd[type]=t;
 const g=ac.createGain();g.connect(ac.destination);
 if(type==='ball'){const vol=Math.min(.6,v/1400);if(vol<.01)return;
  const o=ac.createOscillator();o.frequency.value=2600+Math.random()*500;o.type='sine';
  const n=ac.createBufferSource();n.buffer=noise();const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=3200;f.Q.value=1.5;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(g);n.connect(f).connect(g);o.start(t);o.stop(t+.05);n.start(t);n.stop(t+.05);}
 else if(type==='rail'){const vol=Math.min(.5,v/1800);if(vol<.01)return;
  const n=ac.createBufferSource();n.buffer=noise();const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);n.connect(f).connect(g);n.start(t);n.stop(t+.1);}
 else if(type==='pocket'){
  const o=ac.createOscillator();o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.25);
  const n=ac.createBufferSource();n.buffer=noise();const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);n.connect(f).connect(g);o.start(t);o.stop(t+.3);n.start(t);n.stop(t+.3);}
 else if(type==='cue'){const vol=.15+.4*v;
  const n=ac.createBufferSource();n.buffer=noise();const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.8;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);n.connect(f).connect(g);n.start(t);n.stop(t+.07);}
}

// ================= game setup =================
function newGame(cpu){
 vsCPU=cpu;balls=[mkBall(0,X0+190,MY)];
 const s=shuffle([1,2,3,4,5,6,7]),st=shuffle([9,10,11,12,13,14,15]),order=[];
 order[4]=8;
 if(Math.random()<.5){order[10]=s.pop();order[14]=st.pop()}else{order[10]=st.pop();order[14]=s.pop()}
 order[0]=s.pop()||st.pop(); // a solid at the apex
 const rest=shuffle([...s,...st]);for(let k=0;k<15;k++)if(order[k]===undefined)order[k]=rest.pop();
 let k=0;const row=D*Math.sqrt(3)/2+.05;
 for(let i=0;i<5;i++)for(let j=0;j<=i;j++)balls.push(mkBall(order[k++],FOOT.x+i*row,MY+(j-i/2)*(D+.1)));
 for(const b of balls)randomOrient(b);
 players=[{group:null},{group:null}];cur=Math.random()<.5?0:1;if(!cpu)cur=0;
 isBreak=true;ballInHand=true;kitchen=true;winner=null;tray=[];nominated=-1;
 mode='play';startTurn();toast(vsCPU&&cur===0?'You break':pname(cur)+' to break');
}
function startTurn(){
 phase='aim';power=0;spin={x:0,y:0};timer=TURN_TIME;nominated=-1;ai=null;
 const c=cue();if(!c.on){c.on=true;c.sink=null;c.vx=c.vy=c.ux=c.uy=c.s=0;const p=freeSpot(kitchen?X0+190:MX,MY);c.x=p.x;c.y=p.y}
 // default aim at nearest legal ball
 const t=targets();let best=null,bd=1e9;for(const b of t){const d=Math.hypot(b.x-c.x,b.y-c.y);if(d<bd){bd=d;best=b}}
 if(best)aimAng=Math.atan2(best.y-c.y,best.x-c.x);
 if(isCPU(cur))ai={t:0,stage:'think'};
}
function targets(){
 const me=players[cur];
 return balls.filter(b=>b.on&&b.n&&(me.group?(left(me.group)?(b.n!==8&&groupOf(b.n)===me.group):b.n===8):b.n!==8));
}
function onEight(){const g=players[cur].group;return g&&left(g)===0}
function freeSpot(x,y){
 const ok=(x,y)=>!balls.some(b=>b.on&&b.n!==0&&Math.hypot(b.x-x,b.y-y)<D+1);
 for(let r=0;r<400;r+=4)for(let a=0;a<6.28;a+=.4){const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
  if(px>X0+R&&px<X1-R&&py>Y0+R&&py<Y1-R&&ok(px,py))return {x:px,y:py}}
 return {x,y};
}
function validPlace(x,y){
 if(x<X0+R||x>X1-R||y<Y0+R||y>Y1-R)return false;
 if(kitchen&&x>HEAD)return false;
 return !balls.some(b=>b.on&&b.n&&Math.hypot(b.x-x,b.y-y)<D+.5);
}

// ================= physics =================
function integrate(b,h){
 const sx=b.vx-b.ux,sy=b.vy-b.uy,s=Math.hypot(sx,sy);
 if(s>.5){ // sliding: friction pulls v toward u, and u toward v (5/7 rule)
  const a=SLIDE*h;
  if(3.5*a>=s){b.vx-=sx/3.5;b.vy-=sy/3.5;b.ux=b.vx;b.uy=b.vy}
  else{b.vx-=a*sx/s;b.vy-=a*sy/s;b.ux+=2.5*a*sx/s;b.uy+=2.5*a*sy/s}
 }else{
  const sp=Math.hypot(b.vx,b.vy);
  if(sp>0){const a=ROLL*h;if(a>=sp){b.vx=b.vy=0}else{b.vx-=a*b.vx/sp;b.vy-=a*b.vy/sp}}
  b.ux=b.vx;b.uy=b.vy;
 }
 b.s*=Math.pow(.35,h);if(Math.abs(b.s)<1)b.s=0;
 if(Math.hypot(b.vx,b.vy)<1.5&&Math.hypot(b.ux,b.uy)<1.5){b.vx=b.vy=b.ux=b.uy=0}
 b.x+=b.vx*h;b.y+=b.vy*h;
 rollBall(b,b.ux*h,b.uy*h);
}
function pot(b,pi){
 b.on=false;b.sink={p:PCK[pi],t:0,x:b.x,y:b.y};b.vx=b.vy=b.ux=b.uy=0;
 shot.potted.push(b.n);if(b.n===8)shot.eightPocket=pi;if(b.n===0)shot.scratch=true;snd('pocket');
}
function physStep(h){
 const B=balls;
 for(const b of B)if(b.on)integrate(b,h);
 // pockets
 for(const b of B){if(!b.on)continue;
  let pi=-1;for(let i=0;i<6;i++){const p=PCK[i];if(Math.hypot(b.x-p.x,b.y-p.y)<p.r){pi=i;break}}
  if(pi<0&&(b.x<X0-R||b.x>X1+R||b.y<Y0-R||b.y>Y1+R)){let bd=1e9;for(let i=0;i<6;i++){const d=Math.hypot(b.x-PCK[i].x,b.y-PCK[i].y);if(d<bd){bd=d;pi=i}}}
  if(pi>=0)pot(b,pi);
 }
 // cushions & jaws
 for(const b of B){if(!b.on)continue;
  for(const s of SEGS){
   let t=((b.x-s.a[0])*s.dx+(b.y-s.a[1])*s.dy)/s.l2;t=t<0?0:t>1?1:t;
   const cx=s.a[0]+s.dx*t,cy=s.a[1]+s.dy*t,dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
   if(d2>=R*R||d2<1e-9)continue;
   const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;b.x=cx+nx*R;b.y=cy+ny*R;
   const vn=b.vx*nx+b.vy*ny;
   if(vn<0){
    b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
    // side spin (english) grips the cushion and kicks the ball sideways
    const tx=-ny,ty=nx,kick=Math.max(-.5*-vn,Math.min(.5*-vn,.3*b.s));
    b.vx+=tx*kick;b.vy+=ty*kick;b.s*=.5;
    const un=b.ux*nx+b.uy*ny;b.ux-=un*nx*1.3;b.uy-=un*ny*1.3;
    if(shot&&shot.first!=null)shot.rail=true;
    snd('rail',-vn);
   }
  }
 }
 // ball-ball
 for(let i=0;i<B.length;i++){const a=B[i];if(!a.on)continue;
  for(let j=i+1;j<B.length;j++){const b=B[j];if(!b.on)continue;
   const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
   if(d2>=D*D||d2<1e-9)continue;
   const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(D-d)/2;
   a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
   const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
   if(rv>0){
    const im=rv*(1+BALL_E)/2;
    a.vx-=im*nx;a.vy-=im*ny;b.vx+=im*nx;b.vy+=im*ny;
    // slight collision-induced throw from cut-angle friction
    const tx=-ny,ty=nx,rt=(a.vx-b.vx)*tx+(a.vy-b.vy)*ty,th=Math.max(-.035*im,Math.min(.035*im,rt*.05));
    b.vx+=tx*th;b.vy+=ty*th;
    if(shot&&shot.first==null){if(a.n===0)shot.first=b.n;else if(b.n===0)shot.first=a.n}
    snd('ball',rv);
   }
  }}
}
const moving=()=>balls.some(b=>b.on&&(b.vx||b.vy||b.ux||b.uy))||balls.some(b=>b.sink);

// ================= shooting & rules =================
function shoot(pw){
 if(onEight()&&nominated<0){toast('Call a pocket for the 8 ball first (click a pocket)');return false}
 if(pw<.02)return false;
 const me=players[cur];
 shot={first:null,potted:[],scratch:false,rail:false,cleared:onEight(),eightPocket:-1,nominated};
 strike={t:0,pw,ang:aimAng,sp:{...spin}};phase='strike';ballInHand=false;
 return true;
}
function applyStrike(){
 const c=cue(),{pw,ang,sp}=strike,V=MAXV*(.04+.96*pw*pw*.35+.96*pw*.65);
 const dx=Math.cos(ang),dy=Math.sin(ang);
 c.vx=dx*V;c.vy=dy*V;c.ux=dx*V*SPINK*sp.y;c.uy=dy*V*SPINK*sp.y;c.s=-sp.x*V*ENG;
 snd('cue',pw);strike=null;phase='moving';
}
function endShot(){
 const me=players[cur],other=1-cur,pots=shot.potted.filter(n=>n&&n!==8),eight=shot.potted.includes(8);
 let foul=null;
 if(shot.scratch)foul='Foul! Cue ball potted';
 else if(shot.first==null)foul='Foul! No ball hit';
 else if(me.group){
  if(shot.cleared?shot.first!==8:(shot.first===8||groupOf(shot.first)!==me.group))foul='Foul! Wrong ball hit first';
 }else if(shot.first===8)foul='Foul! Hit the 8 ball first';
 if(!foul&&!isBreak&&!shot.potted.length&&!shot.rail)foul='Foul! No ball hit a cushion';
 if(eight){
  if(isBreak){const e=balls[balls.findIndex(b=>b.n===8)],p=freeSpot(FOOT.x,FOOT.y);
   Object.assign(e,{x:p.x,y:p.y,on:true,sink:null,vx:0,vy:0,ux:0,uy:0});tray=tray.filter(t=>t.n!==8);}
  else{
   if(!foul&&shot.cleared&&shot.eightPocket===shot.nominated){winner=cur;winText=pname(cur)+' potted the 8 ball!'}
   else{winner=other;winText=!shot.cleared?pname(cur)+' potted the 8 ball too early':foul?pname(cur)+' fouled on the 8 ball':pname(cur)+' potted the 8 in the wrong pocket'}
   mode='over';return;
  }
 }
 if(!me.group&&!foul&&pots.length&&!isBreak){
  me.group=groupOf(pots[0]);players[other].group=me.group==='solids'?'stripes':'solids';
  toast(pname(cur)+' is '+me.group.toUpperCase());
 }
 const keep=!foul&&pots.some(n=>!me.group||groupOf(n)===me.group);
 isBreak=false;kitchen=false;
 if(!keep)cur=other;
 ballInHand=!!foul;
 if(foul)toast(foul+' — '+pname(cur)+' has ball in hand');
 else if(keep)toast(pname(cur)+' goes again');

function castAim(cx,cy,dx,dy){
 let best=1e9,hit=null;
 for(const b of balls){if(!b.on||b.n===0)continue;
  const fx=b.x-cx,fy=b.y-cy,t=fx*dx+fy*dy;if(t<=0)continue;
  const p2=fx*fx+fy*fy-t*t;if(p2>D*D)continue;
  const tt=t-Math.sqrt(D*D-p2);if(tt<best){best=tt;hit=b}}
 const tw=Math.min(dx>0?(X1-R-cx)/dx:dx<0?(X0+R-cx)/dx:1e9,dy>0?(Y1-R-cy)/dy:dy<0?(Y0+R-cy)/dy:1e9);

}

function pathClear(ax,ay,bx,by,ign){return !balls.some(b=>b.on&&!ign.includes(b)&&segDist(b.x,b.y,ax,ay,bx,by)<D-.5)}

function aiShots(cx,cy){
 const res=[];
 for(const t of targets())for(let pi=0;pi<6;pi++){
  const p=PCK[pi],pt=pocketTarget(p);let dx=pt.x-t.x,dy=pt.y-t.y;const d2=Math.hypot(dx,dy);dx/=d2;dy/=d2;
  const ang=p.c?(dx*p.o[0]+dy*p.o[1])/Math.SQRT2:Math.abs(dy);
  if(ang<(p.c?.55:.55))continue;
  const gx=t.x-dx*D,gy=t.y-dy*D;
  if(gx<X0+R-1||gx>X1-R+1||gy<Y0+R-1||gy>Y1-R+1)continue;
  if(!pathClear(t.x,t.y,pt.x,pt.y,[t]))continue;

  res.push({ang:Math.atan2(uy,ux),score,pi,d1,d2,cs,t,gx,gy,dx,dy});

    if(validPlace(x,y)&&pathClear(x,y,s.gx,s.gy,[s.t,c])){const sc=s.score2||1/(1+back/400);if(sc>bs){bs=sc;bestPos={x,y}}}}
  }
  if(!bestPos&&kitchen)bestPos={x:X0+190,y:MY+(Math.random()-.5)*80};

  const pw=Math.min(.95,Math.max(.22,.18+(s.d1+s.d2/Math.max(.35,s.cs))/1500));

// ================= input =================
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const humanTurn=()=>mode==='play'&&!paused&&phase==='aim'&&!isCPU(cur);
function aimAt(p){const c=cue();aimAng=Math.atan2(p.y-c.y,p.x-c.x)}
cv.addEventListener('pointerdown',e=>{
 audio();const p=pos(e);
 if(mode==='menu'){if(inBtn(BTN.cpu,p))newGame(true);else if(inBtn(BTN.pvp,p))newGame(false);return}
 if(mode==='over'){if(inBtn(BTN.again,p))newGame(vsCPU);else if(inBtn(BTN.menu,p))mode='menu';return}
 if(paused){if(inBtn(BTN.resume,p))paused=false;else if(inBtn(BTN.restart,p)){paused=false;newGame(vsCPU)}else if(inBtn(BTN.quit,p)){paused=false;mode='menu'}return}
 if(Math.abs(p.x-MENUB.x)<MENUB.s/2+4&&Math.abs(p.y-MENUB.y)<MENUB.s/2+4){paused=true;drag=null;return}
 if(Math.abs(p.x-CUEB.x)<CUEB.s/2&&Math.abs(p.y-CUEB.y)<CUEB.s/2){cueStyle=(cueStyle+1)%CUES.length;return}
 if(spinOpen){const cx=W/2,cy=H/2+20,r=150;
  if(Math.hypot(p.x-cx,p.y-cy)>r+8){spinOpen=false;return}
  setSpin(p);drag={type:'spin'};cv.setPointerCapture(e.pointerId);return}
 if(!humanTurn())return;
 cv.setPointerCapture(e.pointerId);
 if(Math.hypot(p.x-SPINB.x,p.y-SPINB.y)<SPINB.r+6){spinOpen=true;return}
 if(p.x>PBAR.x-12&&p.x<PBAR.x+PBAR.w+12&&p.y>PBAR.y-12&&p.y<PBAR.y+PBAR.h+12){drag={type:'power',y0:p.y};return}
 if(p.x>WHEEL.x-10&&p.x<WHEEL.x+WHEEL.w+10&&p.y>WHEEL.y-10&&p.y<WHEEL.y+WHEEL.h+10){drag={type:'wheel',y:p.y};return}
 if(onEight()){for(let i=0;i<6;i++)if(Math.hypot(p.x-PCK[i].x,p.y-PCK[i].y)<36){nominated=i;toast('Pocket called for the 8 ball');return}}
 const c=cue();
 if(ballInHand&&Math.hypot(p.x-c.x,p.y-c.y)<R+12){drag={type:'cue',x:c.x,y:c.y};return}
 if(p.x>OX&&p.x<OX+OW&&p.y>OY&&p.y<OY+OH){drag={type:'aim'};aimAt(p)}
});
function setSpin(p){const cx=W/2,cy=H/2+20,r=150,dx=(p.x-cx)/(r*.7),dy=-(p.y-cy)/(r*.7),m=Math.hypot(dx,dy);spin={x:m>1?dx/m:dx,y:m>1?dy/m:dy}}
cv.addEventListener('pointermove',e=>{
 if(!drag)return;const p=pos(e);
 if(drag.type==='spin'){setSpin(p);return}
 if(!humanTurn()){drag=null;return}
 if(drag.type==='aim')aimAt(p);
 else if(drag.type==='power')power=Math.max(0,Math.min(1,(p.y-drag.y0)/(PBAR.h*.8)));
 else if(drag.type==='wheel'){const dy=p.y-drag.y;drag.y=p.y;aimAng+=dy*.0008;wheelOff+=dy}
 else if(drag.type==='cue'){drag.x=p.x;drag.y=p.y}
});
cv.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.type==='spin'||!humanTurn())return;
 if(d.type==='power'){if(!shoot(power))power=0}
 if(d.type==='cue'){const c=cue();if(validPlace(d.x,d.y)){c.x=d.x;c.y=d.y}else toast(kitchen?'Place the cue ball behind the line':'Cannot place the cue ball there')}
});
cv.addEventListener('wheel',e=>{if(!humanTurn())return;e.preventDefault();aimAng+=(e.deltaY>0?1:-1)*(e.shiftKey?.0005:.002);wheelOff+=(e.deltaY>0?1:-1)*5},{passive:false});
addEventListener('keydown',e=>{
 if(e.key==='Escape'&&mode==='play'){paused=!paused;return}
 if(!humanTurn())return;
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'){aimAng-=e.shiftKey?.0003:.0015;wheelOff-=3}
 if(e.key==='ArrowRight'||e.key==='ArrowDown'){aimAng+=e.shiftKey?.0003:.0015;wheelOff+=3}
});
